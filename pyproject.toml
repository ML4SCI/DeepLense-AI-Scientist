[project]
name = "dlens"
version = "0.1.0"
description = "DLens – DeepLense AI Scientist framework"
readme = "README.md"
authors = [
    { name = "Pranath Reddy Kumbam", email = "pranath.mail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "llama-cpp-python>=0.3.16",
    "loguru>=0.7.3",
    "mcp>=1.26.0",
    "numba>=0.63.1",
    "outlines>=1.2.9",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=2.0",
    "requests>=2.32.5",
    # Real CNN training/inference backends for the Train/Infer agents (MPS/CPU).
    # A main dependency rather than an extra: the AI-Scientist pipeline
    # (architecture search + tuning loop) cannot run without it, and `uv sync`
    # does not install extras — so a fresh clone used to crash with
    # ModuleNotFoundError: torch.
    "torch>=2.2",
    "xmltodict>=1.0.2",
]

[project.optional-dependencies]
# Retained so `pip install -e .[training]` keeps working; torch is a main
# dependency now, so this extra adds nothing.
training = [
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
