name: CI (downstream)

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint + offline tests (train/infer/analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Lint is scoped to the modules added by this PR.
      - name: Lint (ruff, downstream modules only)
        run: >
          uv run ruff check
          src/dlens/schemas/_downstream.py
          src/dlens/schemas/_experiment.py
          src/dlens/tools/_training.py
          src/dlens/tools/_inference.py
          src/dlens/tools/_analysis.py
          src/dlens/prompts/_downstream.py
          src/dlens/agents/_train.py
          src/dlens/agents/_inference.py
          src/dlens/agents/_analysis.py
          src/dlens/agents/_scripted_downstream.py
          tests/test_downstream_agents.py

      - name: Tests (fully offline)
        run: uv run pytest
